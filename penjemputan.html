<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#25D366">
  <title>Antrean Jemput WA - Bimbel</title>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #f0f2f5; color: #111; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    header { background: #075e54; color: white; padding: 16px; border-radius: 12px 12px 0 0; text-align: center; }
    h1 { font-size: 1.2rem; margin: 0; }
    .card-body { background: white; padding: 16px; border-radius: 0 0 12px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    .section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
    .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #555; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    
    .btn { display: block; width: 100%; text-align: center; background: #25D366; color: white; text-decoration: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; margin-top: 10px; }
    .btn:active { background: #1ebe5d; }
    .btn-secondary { background: #0ea5e9; width: 120px; margin-top: 0; }

    .sync-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .btn-refresh { background: #e5e7eb; color: #111827; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-refresh:active { background: #d1d5db; }
    
    .result-box { margin-top: 15px; padding: 16px; background: #e7f5ed; border-left: 5px solid #25D366; border-radius: 8px; display: none; }
    .student-name { font-size: 1.3rem; font-weight: 700; color: #065f46; margin-bottom: 4px; }
    .parent-info { font-size: 0.9rem; color: #4b5563; margin-bottom: 10px; }
    .preview-msg { background: white; padding: 10px; border-radius: 6px; font-size: 0.85rem; color: #374151; white-space: pre-line; border: 1px solid #d1fae5; margin-bottom: 12px; }
    
    .status-sync { font-size: 0.75rem; color: #059669; background: #d1fae5; padding: 4px 8px; border-radius: 4px; display: inline-block; }
    
    .log-list { margin-top: 15px; font-size: 0.85rem; color: #666; max-height: 120px; overflow-y: auto; }
    .log-item { padding: 4px 0; border-bottom: 1px dashed #eee; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚗 Antrean Jemput Orang Tua</h1>
    </header>
    
    <div class="card-body">
      <!-- Status Data & Tombol Ambil Ulang -->
      <div class="section">
        <div class="sync-bar">
          <span id="syncStatus" class="status-sync">⏳ Mengambil data dari GitHub...</span>
          <button type="button" class="btn-refresh" onclick="muatDataCSV()">🔄 Refresh Data</button>
        </div>
      </div>

      <!-- Input Cari Nama Siswa -->
      <div class="section">
        <label>Ketik Nama Siswa yang Dijemput</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="inputScan" placeholder="Cth: Andi..." onkeypress="cekEnter(event)">
          <button type="button" class="btn btn-secondary" onclick="prosesCari()">Cari</button>
        </div>
      </div>

      <!-- Hasil Deteksi & Tombol WA -->
      <div id="resultBox" class="result-box">
        <div class="student-name" id="resNama">-</div>
        <div class="parent-info" id="resInfo">-</div>
        <div class="preview-msg" id="resPreview">-</div>
        <a id="btnWa" href="#" target="_blank" class="btn">📲 Kirim WA ke Orang Tua</a>
      </div>

      <!-- Riwayat Kirim Hari Ini -->
      <div class="section" style="margin-top: 20px;">
        <label>Riwayat Pesan Terkirim Hari Ini</label>
        <div id="logContainer" class="log-list">Belum ada pesan dikirim hari ini.</div>
      </div>
    </div>
  </div>

  <script>
    let dbSiswa = [];

    // Saat halaman baru dibuka, langsung ambil data terbaru
    window.onload = function() {
      muatDataCSV();
    };

    // Fungsi ambil data CSV dan paksa selalu ambil versi terbaru
    function muatDataCSV() {
      const statusEl = document.getElementById('syncStatus');
      statusEl.style.background = "#fef3c7";
      statusEl.style.color = "#92400e";
      statusEl.innerText = "⏳ Mengambil data terbaru...";

      const alamatCsv = `data.csv?waktu=${Date.now()}`;

      fetch(alamatCsv, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error("File data.csv tidak ditemukan di GitHub!");
          return response.text();
        })
        .then(text => {
          parseCSV(text);
          statusEl.style.background = "#d1fae5";
          statusEl.style.color = "#059669";
          statusEl.innerText = `✅ Terhubung ke GitHub (${dbSiswa.length} data dimuat)`;
        })
        .catch(error => {
          console.error(error);
          statusEl.style.background = "#fee2e2";
          statusEl.style.color = "#dc2626";
          statusEl.innerText = "⚠️ Gagal ambil data. Pakai data cadangan.";
          
          dbSiswa = [
            { nama: "Andi", wa: "6281234567890" },
            { nama: "Jessica .P", wa: "6289876543210" },
            { nama: "Clara", wa: "6281122334455" },
            { nama: "Kevin", wa: "6281122334455" }
          ];
        });
    }

    function parseCSV(text) {
      const rows = text.split('\n');
      let dataBaru = [];

      for (let i = 0; i < rows.length; i++) {
        let row = rows[i].trim();
        if (row) {
          let cols = row.includes(';') ? row.split(';') : row.split(',');
          if (cols.length >= 2) {
            let col1 = cols[0].trim().replace(/['"]+/g, '');
            if (col1.toLowerCase() === 'nama' || col1.toLowerCase() === 'id') continue;

            let nama = cols[0].trim().replace(/['"]+/g, '');
            let wa = cols[1].trim().replace(/[^0-9]/g, '');

            if (wa.startsWith('0')) wa = '62' + wa.slice(1);
            if (nama && wa) {
              dataBaru.push({ nama, wa });
            }
          }
        }
      }
      if (dataBaru.length > 0) dbSiswa = dataBaru;
    }

    function cekEnter(e) {
      if (e.key === 'Enter') {
        prosesCari();
      }
    }

    function prosesCari() {
      const keyword = document.getElementById('inputScan').value.trim().toLowerCase();
      if (!keyword) {
        alert("Ketik nama siswa terlebih dahulu!");
        return;
      }

      const siswaDitemukan = dbSiswa.find(s => s.nama.toLowerCase() === keyword || s.nama.toLowerCase().includes(keyword));
      const resBox = document.getElementById('resultBox');
      
      if (siswaDitemukan) {
        const semuaSaudara = dbSiswa.filter(s => s.wa === siswaDitemukan.wa);
        const adaSiblings = semuaSaudara.length > 1;

        let labelNama = "";
        let kalimatTengah = "";

        if (adaSiblings) {
          const daftarNama = semuaSaudara.map(s => s.nama).join(' & ');
          labelNama = `👨‍👧‍👦 ${daftarNama} (Siblings)`;
          kalimatTengah = `Anak-anak sudah selesai dan bisa dijemput.`;
        } else {
          labelNama = `👤 ${siswaDitemukan.nama}`;
          kalimatTengah = `${siswaDitemukan.nama} sudah selesai dan bisa dijemput.`;
        }

        const infoWa = "No. WA Ortu: " + siswaDitemukan.wa;
        
        const teksPesan = 
          `Halo, Bapak/Ibu/Kakak🙏\n` +
          `${kalimatTengah}\n` +
          `Terima kasih,  Bapak/Ibu/Kakak\n` +
          `🙏🙏🙏`;

        document.getElementById('resNama').innerText = labelNama;
        document.getElementById('resInfo').innerText = infoWa;
        document.getElementById('resPreview').innerText = teksPesan;
        
        const urlWa = `https://wa.me/${siswaDitemukan.wa}?text=${encodeURIComponent(teksPesan)}`;
        document.getElementById('btnWa').setAttribute('href', urlWa);
        resBox.style.display = 'block';

        tambahLog(adaSiblings ? semuaSaudara.map(s => s.nama).join(' & ') : siswaDitemukan.nama);
      } else {
        resBox.style.display = 'none';
        alert(`Siswa dengan nama "${keyword}" tidak ditemukan di database.`);
      }

      document.getElementById('inputScan').value = '';
      document.getElementById('inputScan').focus();
    }

    function tambahLog(namaSiswa) {
      const logContainer = document.getElementById('logContainer');
      const waktu = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      
      if (logContainer.innerText.includes("Belum ada")) {
        logContainer.innerHTML = "";
      }
      
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerText = `[${waktu}] Pesan terkirim untuk ${namaSiswa}`;
      logContainer.prepend(item);
    }
  </script>
</body>
</html>

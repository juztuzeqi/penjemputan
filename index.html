<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antrean Jemput Orang Tua</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6; color: #111827;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 16px;
    margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: #374151; }
  .status {
    font-size: 13px; padding: 8px 12px; border-radius: 8px;
    background: #dcfce7; color: #166534; margin-bottom: 12px;
  }
  .status.error { background: #fee2e2; color: #991b1b; }
  label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
  .input-row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; padding: 10px 12px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px; min-width: 0;
  }
  input[type="text"]:focus { outline: none; border-color: #2563eb; }
  .btn {
    padding: 10px 16px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-scan { background: #0ea5e9; color: #fff; padding: 10px 14px; }
  .btn-scan:hover { background: #0284c7; }
  .btn-wa {
    background: #16a34a; color: #fff; width: 100%;
    padding: 12px; font-size: 15px; margin-top: 12px;
  }
  .btn-wa:hover { background: #15803d; }
  .hasil {
    margin-top: 12px; padding: 12px; border-radius: 8px;
    background: #f9fafb; border: 1px solid #e5e7eb; font-size: 14px;
  }
  .hasil .nama { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .hasil .meta { color: #6b7280; font-size: 13px; }
  .sibling-box {
    margin-top: 10px; padding: 10px; border-radius: 8px;
    background: #eff6ff; border: 1px solid #bfdbfe; font-size: 13px;
  }
  .sibling-box b { color: #1e40af; }
  .sibling-box ul { margin: 6px 0 0 18px; padding: 0; }
  .riwayat-item {
    padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px;
  }
  .riwayat-item:last-child { border-bottom: none; }
  .riwayat-item .waktu { color: #6b7280; font-size: 12px; }
  .empty { color: #9ca3af; font-size: 13px; font-style: italic; }
  #qrModal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.85); z-index: 9999;
    align-items: center; justify-content: center;
  }
  #qrModal .modal-box {
    background: #fff; padding: 16px; border-radius: 12px;
    width: 90%; max-width: 400px;
  }
  #qrModal h3 { margin: 0 0 12px; font-size: 16px; }
  #qrReader { width: 100%; }
  #btnCloseScan {
    margin-top: 12px; width: 100%; padding: 10px;
    background: #ef4444; color: #fff; border: none;
    border-radius: 8px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🚸 Antrean Jemput Orang Tua</h1>
  <div id="status" class="status">⏳ Memuat data...</div>
</div>

<div class="card">
  <h2>Cari Siswa</h2>
  <label for="inputScan">Ketik Nama Siswa atau Scan QR</label>
  <div class="input-row">
    <input type="text" id="inputScan" placeholder="Nama atau kode QR..." autocomplete="off">
    <button type="button" class="btn btn-primary" onclick="prosesCari()">Cari</button>
    <button type="button" class="btn btn-scan" onclick="bukaScan()" title="Scan QR">📷</button>
  </div>
  <div id="hasilCari"></div>
</div>

<div class="card">
  <h2>Riwayat Pesan Terkirim Hari Ini</h2>
  <div id="riwayat"><div class="empty">Belum ada pesan dikirim hari ini.</div></div>
</div>

<!-- Modal Scanner QR -->
<div id="qrModal">
  <div class="modal-box">
    <h3>Scan QR Siswa</h3>
    <div id="qrReader"></div>
    <button type="button" id="btnCloseScan" onclick="tutupScan()">Tutup</button>
  </div>
</div>

<script>
// ============ STATE ============
let dbSiswa = [];
let riwayat = [];
let qrScanner = null;

// ============ UTIL ============
function normalisasiWA(wa) {
  let n = String(wa).replace(/[^0-9]/g, '');
  if (n.startsWith('0')) n = '62' + n.slice(1);
  else if (n.startsWith('8')) n = '62' + n;
  return n;
}

function formatWaktu(d) {
  return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

// ============ LOAD DATA ============
async function loadData() {
  const status = document.getElementById('status');
  try {
    const res = await fetch('data.csv?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();

    dbSiswa = [];
    const lines = text.split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      if (i === 0 && line.toLowerCase().startsWith('kode')) continue;

      const parts = line.split(',').map(s => s.trim());
      let kode = '', nama = '', wa = '';
      if (parts.length >= 3) {
        [kode, nama, wa] = parts;
      } else if (parts.length === 2) {
        [nama, wa] = parts;
      }
      if (nama) dbSiswa.push({ kode, nama, wa });
    }

    status.textContent = `✅ Terhubung ke GitHub (${dbSiswa.length} data dimuat)`;
    status.className = 'status';
  } catch (err) {
    status.textContent = '❌ Gagal memuat data: ' + err.message;
    status.className = 'status error';
  }
}

// ============ CARI ============
function prosesCari() {
  const input = document.getElementById('inputScan').value.trim();
  const hasilDiv = document.getElementById('hasilCari');
  if (!input) {
    hasilDiv.innerHTML = '';
    return;
  }

  const q = input.toLowerCase();
  let found = dbSiswa.find(s =>
    (s.kode && s.kode.toLowerCase() === q) ||
    s.nama.toLowerCase() === q
  );
  if (!found) {
    found = dbSiswa.find(s => s.nama.toLowerCase().includes(q));
  }

  if (!found) {
    hasilDiv.innerHTML = `<div class="hasil" style="color:#991b1b;">❌ Data tidak ditemukan untuk: <b>${escapeHtml(input)}</b></div>`;
    return;
  }

  const waNorm = normalisasiWA(found.wa);

  // Deteksi siblings: 1 nomor WA = 1 keluarga
  const siblings = dbSiswa.filter(s => normalisasiWA(s.wa) === waNorm);
  const isSiblings = siblings.length > 1;

  // Subjek pesan: nama kalau tunggal, "anak-anak" kalau siblings
  const subjek = isSiblings ? 'anak-anak' : found.nama;

  const pesan = encodeURIComponent(
    `Halo, kami dari bimbel menginfokan bahwa ${subjek} sudah siap dijemput. Terima kasih.`
  );
  const waLink = `https://wa.me/${waNorm}?text=${pesan}`;

  hasilDiv.innerHTML = `
    <div class="hasil">
      <div class="nama">${escapeHtml(found.nama)}</div>
      <div class="meta">Kode: ${escapeHtml(found.kode || '-')} · WA: ${escapeHtml(found.wa)}</div>
      ${isSiblings ? `
        <div class="sibling-box">
          <b>⚠️ ${siblings.length} siswa terdeteksi dengan WA yang sama:</b>
          <ul>${siblings.map(s => `<li>${escapeHtml(s.nama)}</li>`).join('')}</ul>
          <div style="margin-top:6px; color:#6b7280; font-size:12px;">
            Pesan akan dikirim sebagai "anak-anak".
          </div>
        </div>
      ` : ''}
      <button type="button" class="btn btn-wa" onclick="kirimWA('${escapeAttr(found.nama)}', '${waLink}')">
        💬 Kirim WA ke Orang Tua
      </button>
    </div>
  `;
}

function kirimWA(nama, waLink) {
  window.open(waLink, '_blank');
  riwayat.unshift({ nama, waktu: new Date() });
  renderRiwayat();
}

function renderRiwayat() {
  const div = document.getElementById('riwayat');
  if (riwayat.length === 0) {
    div.innerHTML = '<div class="empty">Belum ada pesan dikirim hari ini.</div>';
    return;
  }
  div.innerHTML = riwayat.map(r =>
    `<div class="riwayat-item">
       <b>${escapeHtml(r.nama)}</b>
       <div class="waktu">${formatWaktu(r.waktu)}</div>
     </div>`
  ).join('');
}

// ============ ESCAPE ============
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "\\'"); }

// ============ SCAN QR ============
async function bukaScan() {
  document.getElementById('qrModal').style.display = 'flex';
  qrScanner = new Html5Qrcode("qrReader");
  try {
    await qrScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (decodedText) => handleScanResult(decodedText),
      () => {}
    );
  } catch (err) {
    alert("Gagal akses kamera: " + err);
    tutupScan();
  }
}

async function tutupScan() {
  if (qrScanner) {
    try { await qrScanner.stop(); } catch(e){}
    try { qrScanner.clear(); }      catch(e){}
    qrScanner = null;
  }
  document.getElementById('qrModal').style.display = 'none';
}

function handleScanResult(text) {
  tutupScan();
  const match = text.match(/S\d{4}[A-Z0-9]+/i);
  const kode = match ? match[0] : text.trim();

  const input = document.getElementById('inputScan');
  input.value = kode;
  input.dispatchEvent(new Event('input', { bubbles: true }));
  prosesCari();
}

// ============ INIT ============
document.getElementById('inputScan').addEventListener('keydown', e => {
  if (e.key === 'Enter') prosesCari();
});
loadData();
</script>
</body>
</html>
